<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speed Master</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <img class="logo" src="../icons/icon48.png" width="26" height="26" alt="" />
        <div class="head-text">
          <h1>Speed Master</h1>
          <p class="muted">Default speed for every video</p>
        </div>
        <span class="saved" id="saved" hidden>Saved</span>
        <button id="open-options" class="icon-button" type="button" aria-label="Open settings" title="Settings">
          ⚙
        </button>
      </header>

      <div class="speed-row">
        <output id="speed-value" for="speed">1.00x</output>
        <button id="reset" class="reset" type="button">Reset 1x</button>
      </div>

      <input
        id="speed"
        class="slider"
        type="range"
        min="0.25"
        max="4"
        step="0.05"
        value="1"
        aria-label="Default playback speed"
      />

      <div class="presets" id="presets" role="group" aria-label="Speed presets"></div>

      <label class="switch-row" for="pitch">
        <span class="switch-text">
          Keep pitch
          <small>Natural audio at high speeds</small>
        </span>
        <input id="pitch" type="checkbox" checked />
      </label>

      <section class="section">
        <div class="section-head">
          <h2>Presets</h2>
          <button id="preset-defaults" class="link" type="button">Defaults</button>
        </div>
        <div id="preset-editor" class="preset-editor" aria-label="Saved presets"></div>
        <form id="preset-form" class="preset-add">
          <input
            id="preset-input"
            type="number"
            min="0.25"
            max="4"
            step="0.05"
            placeholder="Add 1.15"
            aria-label="New preset speed"
          />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Remembered channels</h2>
          <button id="channels-clear" class="link" type="button">Clear all</button>
        </div>
        <div id="channel-list" class="channel-list"></div>
        <p id="channel-empty" class="empty">
          None. Use “Remember this channel” in the player panel.
        </p>
      </section>

      <section class="section actions">
        <button id="export-settings" type="button">Export</button>
        <button id="import-settings" type="button">Import</button>
        <button id="reset-all" type="button" class="danger">Reset all</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </section>

      <p id="status" class="status" role="status" hidden></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
