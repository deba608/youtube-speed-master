<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Speed Master</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Speed Master</h1>
      <p class="muted">Settings arrive in P3.</p>

      <label class="row" for="speed">
        <span>Default speed</span>
        <output id="speed-value" for="speed">1.00x</output>
      </label>
      <input id="speed" type="range" min="0.25" max="4" step="0.05" value="1" disabled />

      <p class="note">Overlay panel + hotkeys land in P2.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
